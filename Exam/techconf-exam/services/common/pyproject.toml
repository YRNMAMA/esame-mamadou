[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "techconf-common"
version = "0.1.0"
description = "TechConf Shared Utilities"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "requests>=2.31,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["techconf_common*"]